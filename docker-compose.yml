services:
  postgres:
    image: postgres:18
    container_name: restaurant-postgres-docker
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-restaurant_db}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - restaurant-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-restaurant_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: restaurant-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-restaurant_db}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      STAFF_BOOTSTRAP_USERNAME: ${STAFF_BOOTSTRAP_USERNAME:-admin}
      STAFF_BOOTSTRAP_PASSWORD: ${STAFF_BOOTSTRAP_PASSWORD:-change-me-now}
    ports:
      - "8082:8082"

volumes:
  restaurant-postgres-data:
